repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10240"]
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        # Same version as CI (8.30.1): `brew install gitleaks`
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
