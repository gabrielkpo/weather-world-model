name: Slow tests
on:
  schedule:
    - cron: "0 4 * * 0"  # weekly, Sunday 04:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slow:
    # Long calibration checks, excluded from the default run by `-m 'not slow'`; not a required check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run pytest -m slow -p no:cacheprovider --no-cov
