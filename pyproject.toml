[project]
name = "weather-world-model"
version = "0.1.0"
description = "Probing a weather world model with dynamical-systems diagnostics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_world_model"]

# CPU-only PyTorch wheels on Linux (CI): the default Linux wheels bundle CUDA (several GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --cov=weather_world_model --cov-report=term-missing --cov-fail-under=80"
markers = ["slow: long-running calibration checks, excluded by default (run with -m slow)"]
