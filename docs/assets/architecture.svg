<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 546" width="680" height="546" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Training and evaluation of the latent world model</title>
<desc>Phase 1, training: the map at t goes through the encoder and becomes z; the predictor receives z and two noise draws and outputs two possible latents z1 and z2 for t+1; the map at t+1 goes through the target encoder, a slow copy of the encoder; the training loss combines z1, z2 and the target latent. Phase 2, evaluation: a probe reads energies E1 and E2 from z1 and z2, their mean is compared with the true energy at t+1 computed by the simulator.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="546" rx="12" fill="#fcfcfb"/>
<g fill="#1f1f1c" text-anchor="middle" dominant-baseline="central">
<path d="M30 52 V38 H462 V52" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="246" y="24" font-size="14" font-weight="600">Phase 1: training</text>
<path d="M486 52 V38 H664 V52" fill="none" stroke="#BA7517" stroke-width="1.5"/>
<text x="575" y="24" font-size="14" font-weight="600">Phase 2: evaluation</text>

<rect x="30" y="134" width="40" height="36" rx="6" fill="#888780" fill-opacity="0.18" stroke="#888780"/>
<text x="50" y="152" font-size="14" font-weight="600">t</text>
<line x1="70" y1="152" x2="93" y2="152" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="95,102 190,142 190,162 95,202" fill="#1D9E75" fill-opacity="0.2" stroke="#1D9E75"/>
<text x="134" y="152" font-size="14" font-weight="600">Encoder</text>
<line x1="190" y1="152" x2="213" y2="152" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="134" y1="192" x2="134" y2="320" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="144" y="258" font-size="12" text-anchor="start" fill="#52514e">slow copy</text>

<polygon points="215,135 225,125 259,125 249,135" fill="#7F77DD" fill-opacity="0.35" stroke="#7F77DD"/>
<polygon points="249,135 259,125 259,159 249,169" fill="#7F77DD" fill-opacity="0.5" stroke="#7F77DD"/>
<rect x="215" y="135" width="34" height="34" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD"/>
<text x="232" y="152" font-size="14" font-weight="600">z</text>
<text x="237" y="186" font-size="12" fill="#52514e">at t</text>
<line x1="261" y1="150" x2="305" y2="150" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>

<circle cx="345" cy="150" r="38" fill="#378ADD" fill-opacity="0.2" stroke="#378ADD"/>
<text x="345" y="150" font-size="12" font-weight="600">Predictor</text>
<rect x="312" y="58" width="66" height="28" rx="6" fill="#888780" fill-opacity="0.18" stroke="#888780"/>
<text x="345" y="72" font-size="12">Noise 2</text>
<line x1="345" y1="86" x2="345" y2="110" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="312" y="214" width="66" height="28" rx="6" fill="#888780" fill-opacity="0.18" stroke="#888780"/>
<text x="345" y="228" font-size="12">Noise 1</text>
<line x1="345" y1="214" x2="345" y2="190" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>

<line x1="380" y1="134" x2="417" y2="122" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="166" x2="417" y2="196" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="441" y="80" font-size="12" fill="#52514e">at t+1</text>
<polygon points="420,103 430,93 464,93 454,103" fill="#7F77DD" fill-opacity="0.35" stroke="#7F77DD"/>
<polygon points="454,103 464,93 464,127 454,137" fill="#7F77DD" fill-opacity="0.5" stroke="#7F77DD"/>
<rect x="420" y="103" width="34" height="34" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD"/>
<text x="437" y="120" font-size="14" font-weight="600">z1</text>
<polygon points="420,183 430,173 464,173 454,183" fill="#7F77DD" fill-opacity="0.35" stroke="#7F77DD"/>
<polygon points="454,183 464,173 464,207 454,217" fill="#7F77DD" fill-opacity="0.5" stroke="#7F77DD"/>
<rect x="420" y="183" width="34" height="34" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD"/>
<text x="437" y="200" font-size="14" font-weight="600">z2</text>

<path d="M464 106 H478 V330" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<path d="M464 208 H478" fill="none" stroke="#D85A30" stroke-width="1.5"/>

<line x1="466" y1="122" x2="492" y2="146" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="466" y1="194" x2="492" y2="166" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="494" y="134" width="72" height="44" rx="22" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="530" y="156" font-size="14" font-weight="600">Probe</text>
<line x1="566" y1="148" x2="582" y2="124" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="566" y1="164" x2="582" y2="192" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="584" y="100" width="70" height="28" rx="6" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="619" y="114" font-size="12">E1 at t+1</text>
<rect x="584" y="186" width="70" height="28" rx="6" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="619" y="200" font-size="12">E2 at t+1</text>
<line x1="619" y1="214" x2="619" y2="260" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M654 114 H666 V276 H656" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="584" y="262" width="70" height="28" rx="6" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="619" y="276" font-size="12">Mean</text>
<line x1="619" y1="290" x2="619" y2="434" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="22" y="342" width="48" height="36" rx="6" fill="#888780" fill-opacity="0.18" stroke="#888780"/>
<text x="46" y="360" font-size="14" font-weight="600">t+1</text>
<line x1="70" y1="360" x2="93" y2="360" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<polygon points="95,310 190,350 190,370 95,410" fill="#1D9E75" fill-opacity="0.2" stroke="#1D9E75" stroke-dasharray="5 3"/>
<text x="134" y="352" font-size="14" font-weight="600">Target</text>
<text x="134" y="370" font-size="12">encoder</text>
<line x1="190" y1="360" x2="213" y2="360" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<text x="237" y="322" font-size="12" fill="#52514e">at t+1</text>
<polygon points="215,343 225,333 259,333 249,343" fill="#7F77DD" fill-opacity="0.35" stroke="#7F77DD"/>
<polygon points="249,343 259,333 259,367 249,377" fill="#7F77DD" fill-opacity="0.5" stroke="#7F77DD"/>
<rect x="215" y="343" width="34" height="34" fill="#7F77DD" fill-opacity="0.2" stroke="#7F77DD"/>
<text x="232" y="360" font-size="14" font-weight="600">z</text>
<line x1="261" y1="360" x2="370" y2="360" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>

<rect x="372" y="332" width="184" height="56" rx="8" fill="#D85A30" fill-opacity="0.2" stroke="#D85A30"/>
<text x="464" y="350" font-size="14" font-weight="600">Training loss</text>
<text x="464" y="370" font-size="12">closeness − ½ spread</text>

<path d="M46 378 V450 H118" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="120" y="422" width="210" height="56" rx="8" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="225" y="440" font-size="14" font-weight="600">True energy at t+1</text>
<text x="225" y="460" font-size="12">computed by the simulator</text>
<line x1="330" y1="450" x2="603" y2="450" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="619" cy="450" r="14" fill="none" stroke="#BA7517" stroke-width="1.5"/>
<text x="619" y="449" font-size="16" font-weight="600">−</text>
<line x1="619" y1="464" x2="619" y2="488" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="569" y="490" width="100" height="36" rx="6" fill="#BA7517" fill-opacity="0.2" stroke="#BA7517"/>
<text x="619" y="508" font-size="14" font-weight="600">Evaluation</text>
